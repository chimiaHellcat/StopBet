<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acesso bloqueado - StopBet</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .cartao {
    max-width: 480px;
    text-align: center;
    padding: 40px;
  }
  h1 {
    color: #f87171;
    font-size: 1.6em;
    margin-bottom: 0.4em;
  }
  p {
    line-height: 1.6;
    color: #cbd5e1;
  }
  .dominio {
    font-family: 'Consolas', monospace;
    background: #1e293b;
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    margin: 8px 0;
    color: #fca5a5;
  }
  button {
    margin-top: 24px;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover {
    background: #4f46e5;
  }
</style>
</head>
<body>
  <div class="cartao">
    <h1>Este site foi bloqueado</h1>
    <p>O domínio <span class="dominio" id="dominio"></span> foi identificado como uma plataforma de apostas ou cassino online.</p>
    <p>Este bloqueio faz parte do seu processo de tratamento. Uma recaída não é um fracasso — é uma oportunidade de reconhecer o gatilho e reforçar suas estratégias de enfrentamento.</p>
    <button id="fechar">Fechar esta aba</button>
  </div>
  <script src="bloqueado.js"></script>
</body>
</html>
